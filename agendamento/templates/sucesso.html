{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Realizado - Projeto Integrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

        /* Fundo cinza chumbo e centralização TOTAL */
        body { 
            background-color: #363636 !important; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Isso garante o card perfeitamente no meio da tela na vertical */
            min-height: 100vh;
            margin: 0;
        }

        /* Cabeçalho Projeto Integrador */
        .header-projeto {
            text-align: center;
            width: 100%;
            margin-bottom: 30px; /* Um respiro entre o título e o card */
        }

        .titulo-projeto {
            color: #ffffff;
            font-size: clamp(30px, 4.5vw, 54px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.6);
            margin: 0;
        }

        /* Card Cinza Claro (Padrão da sua imagem) */
        .card-sucesso {
            background-color: #e4e4e4 !important; 
            border-radius: 20px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.6), 0 4px 12px rgba(0,0,0,0.4);
            padding: 40px 50px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            animation: flutuar 4s ease-in-out infinite; 
        }

        @keyframes flutuar {
            0%   { transform: translateY(0px); }
            50%  { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        /* Ícone de Check VERDE */
        .sucesso-icone { 
            width: 80px; height: 80px; 
            background-color: #198754; /* Verde sucesso */
            color: #fff; 
            font-size: 45px; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 50%; 
            margin: 0 auto 20px auto; 
            box-shadow: 0 4px 10px rgba(25, 135, 84, 0.4); /* Sombreado verde para dar um destaque */
        }
        
        .boas-vindas { font-size: 36px; font-weight: 800; color: #111; margin-bottom: 5px; }
        .subtitulo { font-size: 18px; color: #555; margin-bottom: 20px; }

        /* Ticket com o número */
        .ticket-box { 
            border: 2px dashed #111; 
            border-radius: 16px; 
            padding: 25px; 
            margin: 25px auto; 
            background-color: #f8f9fa; 
            max-width: 350px; 
        }
        .ticket-numero { font-size: 70px; font-weight: 900; color: #111; line-height: 1; margin: 0; letter-spacing: -2px; }
        
        .texto-info { font-size: 16px; color: #444; font-weight: 500; margin-bottom: 5px; }

        /* Botão Preto Padrão */
        .btn-preto { 
            height: 56px; 
            font-size: 18px; 
            font-weight: 700; 
            border-radius: 12px; 
            background-color: #111; 
            border-color: #111; 
            color: #fff; 
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            margin-top: 15px;
            transition: 0.2s;
        }
        .btn-preto:hover { background-color: #333; color: #fff; }

    </style>
</head>
<body>



    <div class="card-sucesso">
        
        <div class="sucesso-icone">✓</div>

        <h1 class="boas-vindas">Cadastro Realizado!</h1>
        <p class="subtitulo">Guarde o seu número para o sorteio:</p>

        <div class="ticket-box">
            <p class="ticket-numero">{{ numero_sorteio }}</p> 
        </div>

        <p class="texto-info">Aguarde a impressão do seu ticket...</p>
        <p class="texto-info mb-4">Boa sorte, <strong>{{ nome_completo }}</strong>!</p>

        {% if tela %}
        <a href="/?tela={{ tela }}" class="btn-preto">Voltar ao Início</a>
        {% else %}
        <a href="/" class="btn-preto">Voltar ao Início</a>
        {% endif %}

    </div>

</body>
</html>
